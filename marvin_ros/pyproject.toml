[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marvin_ros"
version = "0.1.0"
dependencies = [
    "torchaudio",
    "onnxruntime",
    "silero-vad",
    "pyaudio",
    "roslibpy",
    "bleak==2.1.1",
    "fastapi==0.128.0",
    "gpiozero==2.0.1",
    "numpy==1.24.2",
    "opencv_python==4.8.1.78",
    "picamera2==0.3.31",
    "Pillow==12.1.0",
    "spidev==3.5",
    "st3215==0.4.0",
    "uvicorn==0.40.0"
]
